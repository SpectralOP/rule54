version: v0.4
project:
  name: Weak Turing universality of synchronous elementary Rule 54
  description: A constructive simulation of arbitrary finite-state binary Turing machines
    by synchronous elementary cellular automaton Rule 54. The machine and finite input
    are encoded between two periodic backgrounds fixed independently of the machine
    and input. The development includes ordinary state-and-tape readout, halting preservation
    and reflection, and an unbounded increasing sampling clock on one cellular-automaton
    orbit. This is weak universality; it does not establish universality from a finite
    seed on a uniform blank background.
  authors:
  - SpectralOP
  responsible_maintainers:
  - SpectralOP
  license: MIT

fidelity:
  divergences: The Lean 4.35 port adds module/public declarations and adjusts proof
    scripts for elaboration. The ordinary decoder is factored into the same successive
    decoding stages without changing its computation. Compact symbolic words are proved
    to expand to the original collision fixtures. All 28,314 original fixture obligations
    remain required. Challenge definitions are fully specified and its five theorem
    placeholders are deliberate Comparator statements, excluded from status.sorry_count.
    No definition holes are used.
